repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy llm_absa
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: bandit
        entry: uv run bandit -r llm_absa -q
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest-coverage
        name: pytest with coverage (>=90%)
        entry: uv run pytest -m "not integration" --cov=llm_absa
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
